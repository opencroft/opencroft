name: Checks

on:
  pull_request:
    branches:
      - stage
    types:
      - opened
      - synchronize
      - reopened
  # The same checks against the integration branch itself, so a merge that
  # lands a failure is answered for by the commit that landed it. The
  # pull_request run above is advisory -- nothing refuses a merge over a red
  # one -- so without this the first sign of a red integration branch is
  # someone else discovering it from inside an unrelated change, days later.
  push:
    branches:
      - stage
  # A pull_request-triggered workflow can't trigger on the PR that introduces
  # it -- Actions discovers pull_request workflows from the target branch,
  # not the PR's own branch, so the very first PR carrying this file has
  # nothing to observe it against. workflow_dispatch gives a way to run it
  # for real, on this exact definition, before it ever lands on the target
  # branch and pull_request triggering becomes observable on its own.
  workflow_dispatch:

# A push to a PR branch supersedes whatever check was already running for its
# previous commit -- the old run's answer is about code nobody will merge
# anymore, and this instance's Actions runner has exactly one execution lane
# for everything it serves. Racing a superseded run to completion anyway just
# delays every other PR behind an answer nobody needs.
#
# A run against the integration branch is not superseded the same way: its
# answer is about a commit that has already landed, and cancelling it would
# move the blame for a breakage onto whoever merged next. Those queue instead,
# keyed by ref so they never share a group with a PR's runs.
concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # First job on purpose: this is a scoped install, run exactly the way the
  # target deployment runs its own install (from within the app package's own
  # directory, not the monorepo root), followed by booting the real entrypoint
  # and requiring one route to answer. That is deliberately a narrower
  # guarantee than a root-level install gives, and it is the guarantee that
  # actually matters for "does this deploy" -- cheap and fast, and it runs
  # before the slower typecheck/test job so a resolution failure that only
  # this scoped install would surface is caught before spending time on
  # anything else.
  smoke:
    runs-on: docker
    steps:
      - uses: actions/checkout@v6

      - name: Install (scoped, matching deploy)
        working-directory: apps/opencroft
        run: npm ci

      - name: Boot the real entrypoint and require a route to answer
        working-directory: apps/opencroft
        run: npm run smoke

  # Typecheck (including the workspace-dependency and other guards wired into
  # pretypecheck), the full test suite, and the format/lint gate. A
  # monorepo-root install, deliberately different from `smoke`'s scoped one
  # above -- typecheck needs every workspace, not just what apps/opencroft
  # itself declares.
  checks:
    needs: smoke
    runs-on: docker
    steps:
      - uses: actions/checkout@v6

      - name: Install
        run: npm ci

      - name: Generate the route tree
        # TanStack Router's route tree is generated by the Vite plugin as a
        # side effect of running Vite (dev or build), not committed -- a
        # fresh checkout has no app/routeTree.gen.ts, and typecheck fails on
        # ~50 unrelated-looking route-typing errors without it. Boot just
        # long enough for the plugin to write the file, then stop.
        working-directory: apps/opencroft
        run: |
          npx vite dev &
          VITE_PID=$!
          for i in $(seq 1 30); do
            [ -f app/routeTree.gen.ts ] && break
            sleep 1
          done
          kill $VITE_PID 2>/dev/null || true
          test -f app/routeTree.gen.ts

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      # Format / lint, against the recorded baseline rather than against zero.
      #
      # `biome check` over the whole tree has never been green here -- the
      # linter was switched to `recommended: true` over code that did not
      # satisfy it, so this step was red on every run it has ever had, on every
      # pull request and every push. A check that cannot be got green is not a
      # gate; it is a thing people learn to scroll past.
      #
      # `npm run check` now compares the findings against lint-baseline.json and
      # fails on any in EXCESS of it -- and on any BELOW it, so a fix has to
      # bring the recorded number down in the same change. Every rule stays at
      # full strength; nothing is demoted. The baseline is also the report: it
      # is exact at every commit and can only move down.
      #
      # `npm run check:full` still shows the whole tree for anyone who wants it.
      - name: Format / lint against the recorded baseline
        run: npm run check
