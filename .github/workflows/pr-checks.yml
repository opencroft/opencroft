name: Checks

on:
  push:
    branches:
      - dev
  workflow_dispatch:

# Runs for the same ref queue rather than cancel each other: each answer is
# about a commit that has already landed.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # First job on purpose: an install scoped to the app package (run from its
  # own directory, not the monorepo root), then booting the real entrypoint and
  # requiring one route to answer. A resolution failure that only a scoped
  # install surfaces is caught before the slower job below starts.
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install (scoped to the app package)
        working-directory: apps/opencroft
        run: npm ci

      - name: Boot the real entrypoint and require a route to answer
        working-directory: apps/opencroft
        run: npm run smoke

  # Typecheck (including the guards wired into pretypecheck), the full test
  # suite, and the format/lint gate. A monorepo-root install, unlike `smoke`:
  # typecheck needs every workspace.
  checks:
    needs: smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm ci

      - name: Generate the route tree
        # TanStack Router's route tree is generated by the Vite plugin as a
        # side effect of running Vite, not committed -- a fresh checkout has no
        # app/routeTree.gen.ts, and typecheck fails without it. Boot just long
        # enough for the plugin to write the file, then stop.
        working-directory: apps/opencroft
        run: |
          npx vite dev &
          VITE_PID=$!
          for i in $(seq 1 30); do
            [ -f app/routeTree.gen.ts ] && break
            sleep 1
          done
          kill $VITE_PID 2>/dev/null || true
          test -f app/routeTree.gen.ts

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      # Compares Biome's findings with lint-baseline.json and fails on findings
      # above it and below it, so a fix records the lower number in the same
      # change. `npm run check:full` shows the whole tree without the baseline.
      - name: Format / lint against the recorded baseline
        run: npm run check
